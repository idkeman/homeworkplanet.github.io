<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090e1c"><title>Homework Planet — Game Launcher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e1c;color:#f5f7ff;font:15px system-ui,Arial;min-height:100vh;display:flex;flex-direction:column}.bar{padding:12px 18px;background:#111a2e;border-bottom:1px solid #263553;display:flex;align-items:center;gap:15px}.brand{font-weight:900;color:#00e6a0;text-decoration:none}.bar a{color:#cbd7ef}.name{font-weight:700;flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.btn{background:#24385d;color:white;border:1px solid #3c5684;border-radius:9px;padding:9px 13px;text-decoration:none;cursor:pointer;font:inherit}.stage{flex:1;min-height:65vh;position:relative;background:#050810}.stage iframe{width:100%;height:100%;min-height:75vh;border:0;background:#fff}.message{max-width:800px;margin:10vh auto;padding:28px;background:#111a2e;border:1px solid #263553;border-radius:16px}.message p{color:#a9b8d3;line-height:1.6}.foot{padding:10px 16px;color:#9aabc8;font-size:12px;border-top:1px solid #263553}.hidden{display:none}
</style></head><body><header class="bar"><a class="brand" href="home.html">HOMEWORK PLANET</a><span class="name" id="game-name">Loading game…</span><div class="actions"><a class="btn" href="mega-library.html">All games</a><a class="btn hidden" id="open-source" target="_blank" rel="noopener">Open original host ↗</a></div></header><main class="stage" id="stage"><div class="message"><h2>Loading game…</h2><p>Finding this title in the Homework Planet catalog.</p></div></main><footer class="foot" id="status">Games are loaded from their original hosts when they are not locally available.</footer>
<script>
(async()=>{const stage=document.getElementById('stage'),status=document.getElementById('status'),name=document.getElementById('game-name'),open=document.getElementById('open-source');try{const id=Number(new URLSearchParams(location.search).get('game'));if(!Number.isInteger(id)||id<0)throw Error('Invalid game selection');const r=await fetch('game-catalog.json');if(!r.ok)throw Error('Game catalog failed to load');const c=await r.json(),g=c.games[id];if(!g)throw Error('Game not found in catalog');name.textContent=g.name;document.title=g.name+' — Homework Planet';if(g.kind==='local'){location.replace(g.path);return}const url=g.sourceUrl;if(!url)throw Error('This catalog entry has no playable source URL');open.href=url;open.classList.remove('hidden');if(g.kind==='source'){stage.innerHTML='<div class="message"><h2>'+esc(g.name)+'</h2><p>This entry currently points to an upstream source folder, not a verified playable webpage. It is routed through Homework Planet, but it cannot be embedded as a game until its actual HTML entry point and assets are imported.</p><a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener">Inspect original source folder ↗</a></div>';status.textContent='Source-folder entry · Not yet imported or verified';return}const frame=document.createElement('iframe');frame.allow='fullscreen; autoplay; gamepad; clipboard-read; clipboard-write';frame.allowFullscreen=true;frame.referrerPolicy='no-referrer-when-downgrade';frame.src=url;stage.replaceChildren(frame);status.textContent='Launcher page is hosted by Homework Planet. Game content is still served by '+g.source+'. If it refuses embedding, use “Open original host”.'}catch(e){stage.innerHTML='<div class="message"><h2>Could not launch this game</h2><p>'+esc(e.message)+'</p><a class="btn" href="mega-library.html">Return to library</a></div>';status.textContent='Launcher error'}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;")}})();
</script></body></html>
